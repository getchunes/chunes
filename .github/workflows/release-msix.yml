name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from version.py
        required: true
        default: 1.0.12
        type: string

permissions: {}

concurrency:
  group: store-package
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the Store package
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main and a stable version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "Store packages must be dispatched from main"
          }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Package version must be a stable semantic version"
          }

      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-py313.lock

      - name: Match source version
        shell: pwsh
        run: |
          $sourceVersion = (python -c "from version import __version__; print(__version__)").Trim()
          if ($sourceVersion -cne $env:RELEASE_VERSION) {
            throw "Requested $env:RELEASE_VERSION but source is $sourceVersion"
          }

      - name: Require an unsubmitted Store version
        shell: pwsh
        run: |
          # store/v<version> records a version already uploaded to Partner
          # Center. The Store never lets a version number be reused, so a
          # rebuild at a submitted version can only end in a rejected upload.
          $tag = "store/v$env:RELEASE_VERSION"
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether $tag exists"
          }
          if ($tagRefs.Count -ne 0) {
            throw "$env:RELEASE_VERSION was already submitted to the Store; bump version.py"
          }

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows-py313.lock

      - name: Test
        run: |
          python -m pip check
          python -m compileall -q chunes.py packaged.py presence.py protocol.py settings.py startup_task.py updater.py version.py tests
          python -m unittest discover -s tests -v

      - name: Build the MSIX package
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "build", "dist" -Recurse -Force -ErrorAction SilentlyContinue
          .\scripts\build-msix.ps1

      - name: Verify the exact Store package
        id: verify
        shell: pwsh
        run: |
          $expectedFileVersion = "$env:RELEASE_VERSION.0"
          $exe = Get-Item -LiteralPath "dist\Chunes.exe"
          $expectedMetadata = @{
            ProductName = "Chunes"
            ProductVersion = $expectedFileVersion
            FileVersion = $expectedFileVersion
            CompanyName = "Chunes"
            OriginalFilename = "Chunes.exe"
          }
          foreach ($name in $expectedMetadata.Keys) {
            if ($exe.VersionInfo.$name -cne $expectedMetadata[$name]) {
              throw "Unexpected executable $name`: $($exe.VersionInfo.$name)"
            }
          }

          $expectedName = "Chunes-$env:RELEASE_VERSION-x64.msix"
          $packages = @(Get-ChildItem -LiteralPath "dist" -File -Filter "*.msix")
          if ($packages.Count -ne 1 -or $packages[0].Name -cne $expectedName) {
            throw "Build must produce exactly $expectedName"
          }
          $msix = $packages[0].FullName

          # Partner Center signs the package during certification, so a
          # signature applied here would be rejected on upload.
          $signature = Get-AuthenticodeSignature -LiteralPath $msix
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Store packages must be uploaded unsigned, not $($signature.Status)"
          }

          $extract = Join-Path $env:RUNNER_TEMP "msix-extracted"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($msix, $extract)

          $payload = Join-Path $extract "Chunes.exe"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash) {
            throw "The package does not contain the exact freshly built Chunes.exe"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $extract "resources.pri") -PathType Leaf)) {
            throw "The package has no resource index, so qualified logos cannot resolve"
          }

          [xml]$manifest = Get-Content -LiteralPath (Join-Path $extract "AppxManifest.xml") -Raw
          $source = [xml](Get-Content -LiteralPath "installer\msix\AppxManifest.xml" -Raw)
          $identity = $manifest.Package.Identity
          if ($identity.Name -cne $source.Package.Identity.Name) {
            throw "Package identity name drifted from the source manifest"
          }
          if ($identity.Publisher -cne $source.Package.Identity.Publisher) {
            throw "Package publisher drifted from the source manifest"
          }
          if ($identity.ProcessorArchitecture -cne "x64") {
            throw "Package architecture must be x64"
          }
          if ($identity.Version -cne $expectedFileVersion) {
            throw "Package version is $($identity.Version), expected $expectedFileVersion"
          }
          if ($manifest.Package.Properties.PublisherDisplayName -cne $source.Package.Properties.PublisherDisplayName) {
            throw "Publisher display name drifted from the source manifest"
          }

          $application = $manifest.Package.Applications.Application
          if ($application.EntryPoint -cne "Windows.FullTrustApplication" -or $application.Executable -cne "Chunes.exe") {
            throw "The package must launch Chunes.exe as a full trust application"
          }
          $startupTask = $application.Extensions.Extension.StartupTask
          if ($startupTask.TaskId -cne "ChunesStartupTask") {
            throw "The package must declare the Chunes startup task"
          }

          $visual = $application.VisualElements
          $logos = @(
            $manifest.Package.Properties.Logo,
            $visual.Square44x44Logo,
            $visual.Square150x150Logo,
            $visual.DefaultTile.Square71x71Logo,
            $visual.DefaultTile.Wide310x150Logo
          )
          foreach ($logo in $logos) {
            if (-not $logo) {
              throw "The manifest is missing a declared logo"
            }
            $scaled = Join-Path $extract ($logo -replace '\.png$', '.scale-100.png')
            if (-not (Test-Path -LiteralPath $scaled -PathType Leaf)) {
              throw "The package has no scale-100 asset for $logo"
            }
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msix).Hash.ToLowerInvariant()
          "path=$msix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          @(
            "## Chunes $env:RELEASE_VERSION Store package",
            "",
            "Package version: ``$expectedFileVersion``",
            "SHA-256: ``$hash``",
            "",
            "Upload the artifact to Partner Center, then burn the version number:",
            "",
            '```',
            "git tag store/v$env:RELEASE_VERSION $env:GITHUB_SHA",
            "git push origin store/v$env:RELEASE_VERSION",
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the Partner Center submission package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-msix-${{ inputs.version }}
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
