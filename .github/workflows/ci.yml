name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-py313.lock

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-windows-py313.lock

      - name: Test
        run: |
          python -m pip check
          python -m compileall -q chunes.py packaged.py presence.py protocol.py settings.py startup_task.py updater.py version.py tests
          python -m unittest discover -s tests -v

      - name: Get hash-locked WiX Toolset
        shell: pwsh
        run: |
          $wixBin = (& .\scripts\get-wix.ps1 -Destination (Join-Path $env:RUNNER_TEMP "wix-3.14.1")).Trim()
          "WIX_BIN=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 executable and MSI
        shell: pwsh
        run: .\scripts\build.ps1 -WixBin $env:WIX_BIN

      - name: Verify build metadata
        shell: pwsh
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "version.py does not contain a stable semantic version"
          }
          $fileVersion = "$version.0"
          $exe = Get-Item -LiteralPath "dist\Chunes.exe"
          $expectedMetadata = @{
            ProductName = "Chunes"
            ProductVersion = $fileVersion
            FileVersion = $fileVersion
            CompanyName = "Chunes"
            OriginalFilename = "Chunes.exe"
          }
          foreach ($name in $expectedMetadata.Keys) {
            if ($exe.VersionInfo.$name -cne $expectedMetadata[$name]) {
              throw "Unexpected executable $name`: $($exe.VersionInfo.$name)"
            }
          }

          $msi = "dist\Chunes-$version-x64.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "Expected MSI was not produced: $msi"
          }
          $env:CHUNES_CI_VERSION = $version
          $env:CHUNES_CI_MSI = (Resolve-Path -LiteralPath $msi).Path
          python -c "import os; from updater import verify_msi_identity; verify_msi_identity(os.environ['CHUNES_CI_MSI'], os.environ['CHUNES_CI_VERSION'])"
          if ($LASTEXITCODE -ne 0) {
            throw "MSI identity verification failed"
          }

          foreach ($path in @($exe.FullName, $env:CHUNES_CI_MSI)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Normal CI output must be unsigned: $path ($($signature.Status))"
            }
          }

      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: .\scripts\build-msix.ps1 -SkipExecutable

      - name: Verify MSIX packaging
        shell: pwsh
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          $msix = "dist\Chunes-$version-x64.msix"
          if (-not (Test-Path -LiteralPath $msix -PathType Leaf)) {
            throw "Expected MSIX was not produced: $msix"
          }
          $extract = Join-Path $env:RUNNER_TEMP "ci-msix-extracted"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path -LiteralPath $msix).Path, $extract)
          if (-not (Test-Path -LiteralPath (Join-Path $extract "resources.pri") -PathType Leaf)) {
            throw "The package has no resource index, so qualified logos cannot resolve"
          }
          [xml]$manifest = Get-Content -LiteralPath (Join-Path $extract "AppxManifest.xml") -Raw
          if ($manifest.Package.Identity.Version -cne "$version.0") {
            throw "Package version is $($manifest.Package.Identity.Version), expected $version.0"
          }
          $payload = Join-Path $extract "Chunes.exe"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash -cne (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\Chunes.exe").Hash) {
            throw "The package does not contain the exact built Chunes.exe"
          }
