[package]
name = "chunes"
version = "1.0.15"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Shows the music playing on Windows as a Discord Listening status"
publish = false

[[bin]]
name = "Chunes"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
regex = "1"
roxmltree = "0.20"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
